{% extends "layout.html" %}
{% block title %} 지도 {% endblock %}

{% block section %}
<div class="row">
  <div class="col-lg-8">
    <div class="card-wrapper">
      <div class="card">
        <div class="card-header">
            <div class="row align-items-center">
                <div class="col">
                    <h3 class="mb-0" id="agencyName">{{agency.AgencyName}}</h3>
                    <p class="text-sm mb-0" id="fullAddress">{{agency.FullAddress}}</p>
                </div>
                <div class="col text-right">
                    <button class="btn btn-sm btn-outline-default" type="button" onclick="window.history.back()">뒤로가기</button>
                </div>
            </div>
        </div>        
        <div class="card-body p-0">
          <div id="map" style="width:100%;height:450px;"></div>
        </div>
      </div>
    </div>
  </div>
  {% include 'includes/partner_profile_card.html' %}
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=30a235d0812ee6ecb04abe42da69e940&libraries=services"></script>
<script type="text/javascript">
    var mapContainer = document.getElementById('map'),
        mapOption = {
            center: new kakao.maps.LatLng(37.484373, 127.042290),
            level: 3
        };

    var map = new kakao.maps.Map(mapContainer, mapOption);
    var geocoder = new kakao.maps.services.Geocoder();
    var fullAddress = document.getElementById("fullAddress");
    
    geocoder.addressSearch(fullAddress.innerHTML, function (result, status) {
        if (status === kakao.maps.services.Status.OK) {
            var coords = new kakao.maps.LatLng(result[0].y, result[0].x);

            var marker = new kakao.maps.Marker({
                map: map,
                position: coords
            });

            // var agencyName = document.getElementById("agencyName");
            // var infowindow = new kakao.maps.InfoWindow({
            //     content: '<div style="width:150px;text-align:center;padding:6px 0;">' + agencyName.innerHTML + '</div>'
            // });
            // infowindow.open(map, marker);

            map.setCenter(coords);
        }
    });
</script>
{% endblock %}
