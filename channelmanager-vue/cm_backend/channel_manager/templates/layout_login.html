<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="author" content="Creative Tim">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="튼튼영어 채널관리시스템">
        <title>튼튼영어채널관리 3.0</title>
        <!-- Favicon -->
        <link href="/static/images/favicon.png" rel="icon" type="image/png" color="#ffffff">
        <link href='/static/images/icon192x192.png' rel='icon' type='image/png' />
        <link href='/static/images/icon192x192.png' rel='shortcut icon' type='image/png'/>
        <link href='/static/images/icon128x128.png' rel='apple-touch-icon' type='image/png' />

        <title>튼튼영어채널관리 {% block title %} {% endblock %}</title>

        <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
        <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no' name='viewport' />
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://agency.tuntun.co.kr">
        <meta property="og:title" content="Channel Manager">
        <meta property="og:description" content="튼튼영어 채널관리">
        <meta property="og:image" content="../static/images/open_graph.png">

        <!-- 중요 CSS 사전 로드 -->
        <link rel="preload" href="/static/css/argon.css?v=1.2.1" as="style">
        <link rel="preload" href="/static/css/site.css" as="style">
        
        <!-- 중요 폰트 사전 로드 -->
        <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" as="font" crossorigin>
        <link rel="preload" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" as="style">

        <!-- 중요 스타일 인라인 추가 -->
        <style>
            /* 초기 렌더링에 필요한 중요 스타일 */
            body {
                margin: 0;
                font-family: 'NanumSquareRound', 'Open Sans', sans-serif;
                font-size: 1rem;
                font-weight: 400;
                line-height: 1.5;
                color: #525f7f;
                text-align: left;
                background-color: #f8f9fe;
            }
            .main-content {
                position: relative;
            }
            .container-fluid {
                width: 100%;
                padding-right: 15px;
                padding-left: 15px;
                margin-right: auto;
                margin-left: auto;
            }
            /* 폰트 디스플레이 최적화 */
            @font-face {
                font-family: 'NanumSquareRound';
                font-display: swap;
            }
        </style>

        <!-- Argon CSS -->
        <link rel="stylesheet" href="/static/css/argon.css?v=1.2.1" type="text/css">
        <link rel="stylesheet" href="/static/css/site.css" type="text/css"> 
        <!-- Fonts -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap" type="text/css">
	    <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" type="text/css">
        <!-- Icons -->
        <link rel="stylesheet" href="/static/vendor/nucleo/css/nucleo.css" type="text/css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css" type="text/css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery.scrollbar/0.2.11/jquery.scrollbar.min.css" type="text/css">
        <!-- Page plugins -->
        <link rel="stylesheet" href="/static/vendor/sweetalert2/dist/sweetalert2.min.css" type="text/css">
        <link rel="stylesheet" href="/static/vendor/datatables.net-bs4/css/dataTables.bootstrap4.min.css" type="text/css">
    
        <style>
            /* 네비게이션 바 레이아웃 시프트 방지 */
            .navbar-collapse {
                display: block;
                height: auto !important;
                transition: none; /* 전환 효과 제거 */
            }
            
            /* transform 속성 사용하여 레이아웃 변경 최소화 */
            .animated-element {
                transform: translateX(0);
                will-change: transform;
            }
        </style>
    </head>

    <body class="bg-default">

        <div class="wrapper">
            <!--		ignore missing: 파일이 존재하지 않을 때 오류 대신 빈공간으로 표기-->
            <!--		with context: 변수 승계 처리 (기본 적용되고 변수 승계받지 않으려면 without context  -->
            {% include "includes/navbar_login.html" ignore missing with context %}

            {% block section %}
                <div class="main-content">
                    <div class="container-fluid">
                        <div class="row">
                            빈 페이지
                    </div>
                    </div>
                </div>
            {% endblock %}

            {% include "includes/footer_login.html" ignore missing with context %}
        </div>
    </body>

    <script src="{{ url_for('static',filename='vendor/jquery/dist/jquery.min.js') }}" defer></script>
    <script src="{{ url_for('static',filename='vendor/bootstrap/dist/js/bootstrap.bundle.min.js') }}" defer></script>
    <script src="{{ url_for('static',filename='vendor/js-cookie/js.cookie.js') }}" defer></script>
    <script src="{{ url_for('static',filename='vendor/jquery.scrollbar/jquery.scrollbar.min.js') }}" defer></script>
    <script src="{{ url_for('static',filename='vendor/jquery-scroll-lock/dist/jquery-scrollLock.min.js') }}" defer></script>
    <!-- Optional JS -->
    <script src="{{ url_for('static',filename='vendor/sweetalert2/dist/sweetalert2.min.js') }}" defer></script>
    <script src="{{ url_for('static',filename='vendor/bootstrap-notify/bootstrap-notify.min.js') }}" defer></script>
    <!-- Argon JS -->
    <script src="/static/js/argon.js?v=1.2.1" type="text/javascript" defer></script>
    <script src="{{ url_for('static',filename='js/site.js') }}" defer></script>
    <script defer>
        $(document).ready(function() {
            $('.scrollbar-inner').scrollbar();
        });
    </script>

{% for category, message in get_flashed_messages(with_categories=true) %}
    <script type="text/javascript" defer>
        // type: default, info, success, warning, danger
        site.showNotify(placement='top', align='center', icon='ni ni-bell-55', type='{{category}}', msg='{{message}}')
    </script>
{% endfor %}



</html>
